logLevel: info
webrtc: yes

# Solo escucha en localhost: nginx es el único que habla con él
webrtcAddress: 127.0.0.1:8889

# Puerto único para todo el media UDP
webrtcICEUDPMuxAddress: :8189

# IP pública de la VM (la del paso 1). Sin esto, el SDP anuncia la IP privada 10.x
# y el navegador nunca conecta el video.

#IP del servidor GCP
webrtcAdditionalHosts: [34.0.54.215]
webrtcIPsFromInterfaces: no

paths:
  all:
    publishUser: ""
    readUser: ""
