<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebRTC Local · Emisor</title>
<style>
  :root{
    --bg: #0d1117;
    --panel: #151b23;
    --line: #262e38;
    --text: #e6edf3;
    --dim: #7d8590;
    --accent: #3fb950;
    --accent-dim: #1f6b34;
    --warn: #d29922;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 32px 20px 60px;
  }
  header{
    width:100%;
    max-width: 720px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
  }
  h1{ font-size: 19px; font-weight: 600; margin:0; letter-spacing: -0.01em; }
  h1 span{ color: var(--dim); font-weight: 400; }
  .status{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--dim);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--dim); transition: background .2s; }
  .dot.live{ background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.warn{ background: var(--warn); }

  main{ width:100%; max-width: 720px; }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .panel-head{
    display:flex; justify-content:space-between; align-items:center;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--dim); font-family: var(--mono);
  }
  video{
    width:100%; display:block; background:#000;
    aspect-ratio: 16/9; object-fit: contain;
  }

  .controls{
    width:100%; max-width: 720px; margin-top: 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; display:flex; flex-wrap:wrap; gap: 14px; align-items:flex-end;
  }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size: 11px; color: var(--dim); font-family: var(--mono); }
  select, button{
    background:#0d1117; border:1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  select{ min-width: 150px; }
  button{
    cursor:pointer; border-color: var(--accent-dim); color: var(--accent);
    font-weight: 600; transition: background .15s, opacity .15s;
  }
  button:hover{ background: rgba(63,185,80,0.08); }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  button.stop{ border-color: #8b3a3a; color: #f0868b; }
  button.stop:hover{ background: rgba(240,134,139,0.08); }

  .note{
    max-width: 720px; width:100%; margin-top: 18px;
    font-size: 12.5px; color: var(--dim); line-height: 1.6;
  }
  .note code{
    background: var(--panel); border: 1px solid var(--line);
    padding: 1px 5px; border-radius: 4px; font-family: var(--mono); color: var(--text);
  }
</style>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

<header>
  <h1>WebRTC Local <span>· emisor</span></h1>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Detenido</span>
  </div>
</header>

<main>
  <div class="panel">
    <div class="panel-head">
      <span>Vista previa (local)</span>
      <div style="display:flex; gap:10px; align-items:center;">
        <label style="cursor:pointer; display:flex; align-items:center; gap:4px; font-size:11px; margin:0;">
          <input type="checkbox" id="vrMode"> Modo 360° (VR)
        </label>
        <span id="srcInfo">—</span>
      </div>
    </div>
    
    <div id="videoContainer2D">
      <video id="localVideo" autoplay muted playsinline ></video>
    </div>

    <div id="videoContainerVR" style="display:none; width: 100%; aspect-ratio: 16/9; position: relative; background:#000;">
      <a-scene embedded style="width: 100%; height: 100%;" vr-mode-ui="enabled: true">
        <a-videosphere src="#localVideo" rotation="0 -90 0"></a-videosphere>
        <a-entity camera look-controls position="0 0 0"></a-entity>
      </a-scene>
    </div>
  </div>
</main>

<div class="controls">
  <div class="field">
    <label for="camSelect">Cámara</label>
    <select id="camSelect"></select>
  </div>
  <div class="field">
    <label for="resSelect">Calidad</label>
    <select id="resSelect">
      <option value="native" selected>Nativa (recomendado para 360°)</option>
      <option value="4k">2160p (4K) 30fps</option>
      <option value="1440">1440p 30fps</option>
      <option value="1080">1080p 30/60fps</option>
      <option value="720">720p 60fps</option>
    </select>
  </div>
  <button id="startBtn">Iniciar emisión</button>
  <button id="stopBtn" class="stop" disabled>Detener</button>
</div>



<p class="note">
  Esta página captura la cámara y la envía por WebRTC al servidor MediaMTX usando el estándar WHIP. 
  Asegúrate de cambiar la IP <code>192.168.1.100</code> en el código por la IP real del servidor Docker.
</p>

<script>
const MEDIAMTX_URL = "http://192.168.1.100:8889"; // CAMBIA ESTO A LA IP DE TU SERVIDOR DOCKER
const STREAM_NAME = "demo-latencia";

const localVideo = document.getElementById('localVideo');

const vrMode = document.getElementById('vrMode');
const container2D = document.getElementById('videoContainer2D');
const containerVR = document.getElementById('videoContainerVR');

vrMode.addEventListener('change', (e) => {
  if (e.target.checked) {
    container2D.style.position = 'absolute';
    container2D.style.opacity = '0';
    container2D.style.pointerEvents = 'none';
    containerVR.style.display = 'block';
  } else {
    container2D.style.position = 'relative';
    container2D.style.opacity = '1';
    container2D.style.pointerEvents = 'auto';
    containerVR.style.display = 'none';
  }
});

const camSelect = document.getElementById('camSelect');
const resSelect = document.getElementById('resSelect');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const srcInfo = document.getElementById('srcInfo');

let localStream = null;
let pc = null;
let emitting = false;

const RES_PRESETS = {
  'native': { width: null, height: null, frameRate: null },
  '4k':   { width: 3840, height: 2160, frameRate: 30 },
  '1440': { width: 2560, height: 1440, frameRate: 30 },
  '1080': { width: 1920, height: 1080, frameRate: 60 },
  '720':  { width: 1280, height: 720,  frameRate: 60 },
};

async function listCameras() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    camSelect.innerHTML = '';
    cams.forEach((c, i) => {
      const opt = document.createElement('option');
      opt.value = c.deviceId;
      opt.textContent = c.label || `Cámara ${i + 1}`;
      camSelect.appendChild(opt);
    });
  } catch (e) { console.warn('No se pudieron listar cámaras aún:', e); }
}

function setStatus(state, label) {
  statusDot.className = 'dot' + (state === 'live' ? ' live' : state === 'warn' ? ' warn' : '');
  statusText.textContent = label;
}

async function start() {
  startBtn.disabled = true;

  const preset = RES_PRESETS[resSelect.value];
  const videoConstraints = { deviceId: camSelect.value ? { exact: camSelect.value } : undefined };
  if (preset.width)  videoConstraints.width  = { ideal: preset.width };
  if (preset.height) videoConstraints.height = { ideal: preset.height };
  if (preset.frameRate) videoConstraints.frameRate = { ideal: preset.frameRate };

  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: videoConstraints });
  } catch (e) {
    alert('No se pudo acceder a la cámara: ' + e.message);
    startBtn.disabled = false;
    return;
  }

  localVideo.srcObject = localStream;
  const track = localStream.getVideoTracks()[0];
  const settings = track.getSettings();
  srcInfo.textContent = `${settings.width}×${settings.height} @${Math.round(settings.frameRate || 0)}fps`;
  if (settings.width && settings.height) localVideo.style.aspectRatio = `${settings.width}/${settings.height}`;

  emitting = true;
  stopBtn.disabled = false;
  setStatus('warn', 'Conectando a MediaMTX…');

  await createOfferFor();
}

async function createOfferFor() {
  if (pc) pc.close();
  pc = new RTCPeerConnection();

  const track = localStream.getVideoTracks()[0];
  pc.addTrack(track, localStream);

  pc.onconnectionstatechange = () => {
    console.log('[emisor] connectionState:', pc.connectionState);
    if (pc.connectionState === 'connected') {
      setStatus('live', 'Transmitiendo a MediaMTX');
    } else if (['disconnected','failed','closed'].includes(pc.connectionState)) {
      setStatus('warn', 'Desconectado');
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  // Esperar a que los candidatos ICE locales terminen de recolectarse
  await new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') {
      resolve();
    } else {
      const checkState = () => {
        if (pc.iceGatheringState === 'complete') {
          pc.removeEventListener('icegatheringstatechange', checkState);
          resolve();
        }
      };
      pc.addEventListener('icegatheringstatechange', checkState);
      // Timeout de seguridad en caso de que tarde demasiado
      setTimeout(() => {
        pc.removeEventListener('icegatheringstatechange', checkState);
        resolve();
      }, 2000);
    }
  });

  console.log('[emisor] enviando SDP al servidor WHIP');
  try {
    const res = await fetch(`${MEDIAMTX_URL}/${STREAM_NAME}/whip`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp
    });

    if (!res.ok) throw new Error(`Error de servidor: ${res.status}`);
    
    const answer = await res.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answer });
    console.log('[emisor] Conectado exitosamente');
  } catch (e) {
    console.error('Fallo al conectar con MediaMTX:', e);
    setStatus('warn', 'Error conectando al servidor');
    stop();
  }
}

function stop() {
  emitting = false;

  if (pc) { 
    // Opcional: hacer un DELETE a MediaMTX para cerrar el stream (no estándar en todos los WHIP servers, pero buena práctica)
    fetch(`${MEDIAMTX_URL}/${STREAM_NAME}/whip`, { method: 'DELETE' }).catch(()=>{});
    pc.close(); 
    pc = null; 
  }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }

  localVideo.srcObject = null;
  srcInfo.textContent = '—';

  startBtn.disabled = false;
  stopBtn.disabled = true;
  setStatus('stopped', 'Detenido');
}

startBtn.addEventListener('click', start);
stopBtn.addEventListener('click', stop);

(async () => {
  try {
    const tmp = await navigator.mediaDevices.getUserMedia({ video: true });
    tmp.getTracks().forEach(t => t.stop());
  } catch (e) { /* el usuario decidirá al pulsar Iniciar */ }
  await listCameras();
})();
navigator.mediaDevices.addEventListener?.('devicechange', listCameras);
</script>
</body>
</html>
